<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affectations et recherche</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="entete" class="entete"></header>
<main>
  <h1>Affectations et recherche</h1>

  <section class="carte" aria-labelledby="titre-recherche">
    <h2 id="titre-recherche">Rechercher un dossier</h2>
    <form id="formulaire-recherche" novalidate>
      <div class="champ filtre">
        <label for="filtre-statut">Statut</label>
        <select id="filtre-statut">
          <option value="">Tous</option>
          <option value="SOUMISE">Soumises</option>
          <option value="VALIDEE">Validées</option>
          <option value="REFUSEE">Refusées</option>
          <option value="BROUILLON">Brouillons</option>
        </select>
      </div>
      <div class="champ filtre">
        <label for="recherche-nom">Nom de l'étudiant</label>
        <input id="recherche-nom" type="text" maxlength="60" autocomplete="off">
      </div>
      <button type="submit">Rechercher</button>
    </form>
    <p id="erreur-generale" class="erreur" role="alert" hidden></p>
    <p id="confirmation" class="confirmation" role="status"></p>
  </section>

  <ul id="liste-demandes" aria-label="Dossiers"></ul>
</main>
<script src="app.js"></script>
<script>
  enTete('SECRETARIAT');
  const formulaire = document.getElementById('formulaire-recherche');
  const statut = document.getElementById('filtre-statut');
  const nom = document.getElementById('recherche-nom');
  const liste = document.getElementById('liste-demandes');
  const erreurGenerale = document.getElementById('erreur-generale');
  const confirmation = document.getElementById('confirmation');
  let encadreurs = [];
  // Seule la dernière demande de liste est affichée : une réponse plus ancienne ne doit pas l'écraser.
  let dernierChargement = 0;

  function ligneAffectation(demande) {
    const li = ligneDemande(demande);
    if (demande.statut !== 'VALIDEE') return li;
    const actions = document.createElement('div');
    actions.className = 'actions';
    const champ = document.createElement('div');
    champ.className = 'champ';
    const etiquette = document.createElement('label');
    etiquette.htmlFor = `encadreur-${demande.id}`;
    etiquette.textContent = `Encadreur de la demande n° ${demande.id}`;
    const choix = document.createElement('select');
    choix.id = `encadreur-${demande.id}`;
    for (const e of encadreurs) {
      const option = document.createElement('option');
      option.value = String(e.id);
      option.textContent = `${e.prenom} ${e.nom} — ${e.grade}`;
      if (demande.encadreur_nom && e.nom === demande.encadreur_nom && e.prenom === demande.encadreur_prenom) {
        option.selected = true;
      }
      choix.appendChild(option);
    }
    champ.append(etiquette, choix);
    actions.appendChild(champ);
    const bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.dataset.action = 'affecter';
    bouton.dataset.id = String(demande.id);
    bouton.textContent = demande.encadreur_nom
      ? `Changer l'encadreur de la demande n° ${demande.id}`
      : `Affecter l'encadreur à la demande n° ${demande.id}`;
    actions.appendChild(bouton);
    li.appendChild(actions);
    return li;
  }

  async function chargerEncadreurs() {
    const resultat = await appeler('GET', 'api/encadreurs');
    if (resultat.statut === 401) return allerVersConnexion();
    if (resultat.statut === 200) encadreurs = resultat.donnees.encadreurs;
  }

  async function chargerListe() {
    const numero = ++dernierChargement;
    const parametres = new URLSearchParams();
    if (statut.value) parametres.set('statut', statut.value);
    if (nom.value.trim()) parametres.set('nom', nom.value.trim());
    const suite = parametres.toString() ? `?${parametres}` : '';
    const resultat = await appeler('GET', `api/demandes${suite}`);
    if (numero !== dernierChargement) return;
    if (resultat.statut === 401) return allerVersConnexion();
    if (resultat.statut !== 200) return afficher(erreurGenerale, texteDErreur(resultat));
    const demandes = resultat.donnees.demandes;
    if (demandes.length === 0) return listeVide(liste, 'Aucun dossier ne correspond à la recherche.');
    liste.replaceChildren(...demandes.map(ligneAffectation));
  }

  formulaire.addEventListener('submit', (evenement) => {
    evenement.preventDefault();
    afficher(erreurGenerale, '');
    confirmation.textContent = '';
    chargerListe();
  });

  liste.addEventListener('click', async (evenement) => {
    const bouton = evenement.target.closest('button[data-action="affecter"]');
    if (!bouton) return;
    const id = bouton.dataset.id;
    afficher(erreurGenerale, '');
    confirmation.textContent = '';
    const choix = document.getElementById(`encadreur-${id}`);
    const resultat = await appeler('PATCH', `api/demandes/${id}/encadreur`, { encadreurId: Number(choix.value) });
    if (resultat.statut === 200) {
      confirmation.textContent = `Encadreur affecté à la demande n° ${id}.`;
      return chargerListe();
    }
    if (resultat.statut === 401) return allerVersConnexion();
    afficher(erreurGenerale, texteDErreur(resultat));
  });

  chargerEncadreurs().then(chargerListe);
</script>
</body>
</html>
